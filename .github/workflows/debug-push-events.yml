name: Push events debugger

on:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'api-**'
    paths:
      - 'src/**'

jobs:
  event_debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Dump event contents
        env:
          GITHUB_EVENTS_JSON: ${{ toJSON(github) }}
        run: |
          echo "${{ env.GITHUB_EVENTS_JSON }}"

      - name: View context attributes
        uses: actions/github-script@v7
        with:
          script: console.log(context)

      - name: Debug getTree
        id: event_trigger
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { tree } } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: context.payload.head_commit.tree_id,
            })
            console.log(tree)

  branches_and_paths_or_tags_and_paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check event trigger enabled
        id: event_trigger
        env:
          PATHS: 'src/'
        run: |
          git checkout HEAD^ --quiet
          files=$(jq -n '$ARGS.positional' --args -- $(git show --pretty='' --name-only "${{ github.sha }}"))
          if "$(jq -n -r --argjson files "${files}" --argjson filter "${{ env.PATHS }}" 'isempty($files[]|select(startswith($filter)))')"; then
            echo "enabled=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "enabled=true" >> $GITHUB_OUTPUT
          case "${{ github.ref_type }}" in
            "branch") echo "name=branch_and_path" >> $GITHUB_OUTPUT ;;
            "tag") echo "name=tag_and_path" >> $GITHUB_OUTPUT ;;
          esac

      - name: Debug event trigger
        run: |
          echo "Event trigger enabled: ${{ steps.event_trigger.outputs.enabled }}"
          echo "Event trigger name: ${{ steps.event_trigger.outputs.name }}"
