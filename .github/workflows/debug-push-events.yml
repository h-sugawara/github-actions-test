name: Push events debugger

on:
  push:
    branches:
      - 'feature/**'
    tags:
      - 'api-**'
    paths:
      - 'src/**'

jobs:
  event_debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Dump event contents
        env:
          GITHUB_EVENTS_JSON: ${{ toJSON(github) }}
        run: |
          echo "${{ env.GITHUB_EVENTS_JSON }}"

      - name: View context attributes
        uses: actions/github-script@v7
        with:
          script: console.log(context)

  branches_and_paths_or_tags_and_paths:
    runs-on: ubuntu-latest
    steps:
      - name: Check event trigger enabled
        id: event_trigger
        uses: actions/github-script@v7
        env:
          PATHS: 'src/'
        with:
          script: |
            const { GITHUB_REF_TYPE, PATHS } = process.env
            const { tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: context.payload.head_commit.tree_id,
            })
            const ret = { enabled: false }
            if (['branch','tag'].includes(GITHUB_REF_TYPE)) {
              for (const { path } of tree) {
                if (path.startsWith(PATHS)) {
                  ret.enabled = true
                  break
                }
              }
            }
            return ret

      - name: Dump event contents
        run: |
          echo "${{ fromJSON(steps.event_trigger.outputs.result).enabled }}"
